<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sitemizi Nasıl Buldunuz?</title>
</head>
<link rel="stylesheet" href="ödevstill.css">
<body>

  <h2>Sitemizi nasıl buldunuz?</h2>

  <form action="" method="get">
    
    <label>İsim Soyisim:</label><br>
    <input type="text" name="isim_soyisim" required><br><br>

    <label>Telefon Numarası:</label><br>
    <input type="tel" name="telefon" placeholder="05xxxxxxxxx" required><br><br>

    <label>Memnuniyet Oranı (%):</label><br>
    <input type="number" name="memnuniyet" min="0" max="100" required><br><br>

    <label>Öneriniz:</label><br>
    <textarea name="oneri" rows="4" cols="40" placeholder="Buraya yazabilirsiniz..."></textarea><br><br>

    <input type="submit" value="Gönder">

  </form>

</body>
</html>
